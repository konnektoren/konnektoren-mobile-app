[package]
name = "konnektoren-mobile-app-ui"
version.workspace = true
description.workspace = true
edition = "2024"

[workspace]
resolver = "3"
members = ["download-page", "src-tauri"]

[workspace.package]
version = "0.1.7"
description = "Mobile App for Konnektoren"

[package.metadata.release]
tag = true
tag-name = "konnektoren-mobile-app-v{{version}}"
pre-release-hook = ["git", "cliff", "--offline", "--no-exec", "--tag", "konnektoren-mobile-app-v{{version}}", "--output", "CHANGELOG.md"]
pre-release-replacements = [
    { file = "src-tauri/tauri.conf.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"', exactly = 1 },
    { file = "snapcraft.yaml", search = '(?m)^version: "[^"]+"', replace = 'version: "{{version}}"', exactly = 1 },
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
log = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
gloo = { version = "0.12", features = ["timers"] }
yew = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlAudioElement"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
konnektoren-core = { git = "https://github.com/konnektoren/konnektoren-rs.git", default-features = false }
konnektoren-yew = { git = "https://github.com/konnektoren/konnektoren-yew.git", default-features = false, features = [
    "csr",
    "storage",
    "effects",
    "music",
    "navigation",
] }
yew_router = { git = "https://github.com/chriamue/yew-ssg", package = "yew-ssg-router" }

[workspace.dependencies]
yew = { version = "0.23", features = ["csr"] }
