name: konnektoren-app
base: core24
# Kept in sync with Cargo.toml by `just release` (see [package.metadata.release]).
version: "0.1.7"
title: Konnektoren App
summary: Learn German grammar with Konnektoren.
description: |
  Konnektoren is a language learning app for German learners. Practise German
  connectors (Konnektoren), articles and other grammar topics with short,
  game-like challenges.

  Features:
  - Multiple-choice grammar challenges with instant feedback and sounds
  - Example sentences as help for every question
  - Results with score and time taken
  - Progress is stored locally on your device
license: MIT
website: https://konnektoren.help
source-code: https://github.com/konnektoren/konnektoren-mobile-app
issues: https://github.com/konnektoren/konnektoren-mobile-app/issues
icon: app-stores/assets/app-icon.png

platforms:
  amd64:
  arm64:

grade: stable
confinement: strict

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1

apps:
  konnektoren-app:
    command: usr/bin/konnektoren-app
    desktop: usr/share/applications/konnektoren-app.desktop
    extensions: [gnome]
    # The gnome extension already provides desktop, desktop-legacy, gsettings, opengl, wayland and x11.
    plugs:
      - network
      - audio-playback # challenge sound effects

parts:
  konnektoren-app:
    plugin: dump
    source: .
    build-snaps:
      - rustup/latest/stable
    build-packages:
      - build-essential
      - curl
      - file
      - git
      - just # Trunk's pre_build hook runs `just setup-styles`
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libssl-dev
      - libwebkit2gtk-4.1-dev
      - libxdo-dev
      - pkg-config
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    override-build: |
      set -eu
      rustup default stable
      rustup target add wasm32-unknown-unknown
      export PATH="$HOME/.cargo/bin:$PATH"
      cargo install trunk --locked
      cargo install tauri-cli --version "^2" --locked

      # beforeBuildCommand (trunk build) builds the frontend, then Tauri bundles a .deb.
      cargo tauri build --bundles deb
      dpkg -x target/release/bundle/deb/*.deb "$CRAFT_PART_INSTALL/"

      # Point the launcher icon inside the snap instead of the host's /usr.
      sed -i -e 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/128x128/apps/konnektoren-app.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/konnektoren-app.desktop"
